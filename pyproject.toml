[project]
name = "shorts-multiuploader"
version = "0.1.0"
description = "Reusable code-first YouTube Shorts cross-posting pipeline with agent recovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.50",
    "python-dotenv>=1.2.1",
    "yt-dlp>=2026.3.17",
]

[project.scripts]
shorts-dist = "shorts_distributor.main:main"
shorts-web = "shorts_distributor.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shorts_distributor"]

[dependency-groups]
dev = []

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
